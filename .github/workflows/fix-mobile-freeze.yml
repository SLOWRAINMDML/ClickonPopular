name: fix-mobile-freeze
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[fix-mobile-freeze]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply freeze repair
        run: python3 scripts/fix-mobile-freeze.py
      - name: Validate syntax and tests
        run: |
          node --check src/app.js
          node --check service-worker.js
          npm test
          npm run smoke
          git diff --check
      - name: Commit clean repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stop mobile main-thread freeze'
          git push origin HEAD:main
