name: materialize-engagement-hooks
on:
  push:
    branches: [engagement-hooks-v2]
    paths: ['.github/workflows/materialize-engagement-hooks.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engagement-hooks-v2
          fetch-depth: 0
      - name: Integrate hook engine
        run: python3 .ops/integrate_engagement_hooks.py
      - name: Validate hook build
        run: |
          node --check src/app.js
          node --check src/game.js
          node --check src/engagement.js
          npm test
          npm run smoke
          grep -q "engagement.css" index.html
          grep -q "src/engagement.js" service-worker.js
          ! grep -q "MutationObserver" src/app.js
      - name: Commit integrated hook system
        run: |
          rm .github/workflows/materialize-engagement-hooks.yml
          rm -rf .ops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: activate multi-loop engagement system"
          git push origin engagement-hooks-v2
