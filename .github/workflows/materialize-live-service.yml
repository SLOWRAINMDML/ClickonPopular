name: materialize-live-service

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-service-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-live-service]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact runtime
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/app.part01a.b64 .staging/app.part01b.b64 .staging/app.part02.b64 .staging/app.part03.b64 .staging/app.part04a.b64 .staging/app.part04b.b64 .staging/app.part05.b64 | base64 -d > src/app.js
          test "$(git hash-object src/app.js)" = "edf7b1f588484378ea373dea8000aa062c06430a"
          rm -rf .staging .github/workflows/materialize-live-service.yml
          npm test
          npm run smoke
      - name: Commit clean service build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch live service progression"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy clean build
        id: deployment
        uses: actions/deploy-pages@v4
